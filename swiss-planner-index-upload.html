<style>

.day-figure{overflow:visible;transform-box:fill-box;transform-origin:50% 92%;will-change:transform}
.day-figure.person-0{animation-delay:-.35s}

.day-figure.act-0{animation:day-step 1.05s ease-in-out infinite}

.day-figure.act-3{animation:day-cocoa 1.8s ease-in-out infinite}
.day-figure.act-4{animation:day-photo 2.1s ease-in-out infinite}
.day-figure.act-5{animation:day-sled 1.25s ease-in-out infinite}
.day-figure.act-6{animation:day-throw 1.35s ease-in-out infinite}
.day-figure.act-7{animation:day-skate 1.4s ease-in-out infinite}
.day-figure.act-8{animation:day-map 2.4s ease-in-out infinite}
.day-figure.act-9{animation:day-cable 2.6s ease-in-out infinite}
.day-figure.act-10{animation:day-train 1.7s ease-in-out infinite}

.day-figure.act-12{animation:day-movie 3s ease-in-out infinite}
.day-figure.act-13{animation:day-nap 3.8s ease-in-out infinite}
.day-figure.act-14{animation:day-shop 1.8s ease-in-out infinite}
.day-figure.act-15{animation:day-tram 1.9s ease-in-out infinite}
.day-figure.act-16{animation:day-snack 2s ease-in-out infinite}

.day-figure{transform-box:fill-box;transform-origin:50% 88%;will-change:transform}
.day-figure.person-1{animation-delay:-.45s!important}.day-figure.person-2{animation-delay:-.9s!important}
.vehicle-cable{transform-box:fill-box;transform-origin:center;animation:cable-glide 5.5s ease-in-out infinite}
.vehicle-train{transform-box:fill-box;transform-origin:center;animation:train-glide 2.8s ease-in-out infinite}
.vehicle-tram{transform-box:fill-box;transform-origin:center;animation:tram-glide 3.2s ease-in-out infinite}
@keyframes cable-glide{0%,100%{transform:translate(-18px,3px)}50%{transform:translate(28px,-2px)}}
@keyframes train-glide{0%,100%{transform:translateX(-5px)}50%{transform:translateX(9px)}}
@keyframes tram-glide{0%,100%{transform:translateX(-7px)}50%{transform:translateX(11px)}}

@keyframes day-step{0%,100%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-3px) rotate(3deg)}50%{transform:translateY(-8px) rotate(5deg)}75%{transform:translateY(-2px) rotate(-3deg)}}

@keyframes day-cocoa{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-7deg)}65%{transform:translateY(-2px) rotate(7deg)}}

@keyframes day-train{0%,100%{transform:translateX(-1px)}50%{transform:translateX(2px)}}
@keyframes day-look{0%,100%{transform:rotate(0)}40%{transform:rotate(3deg) translateY(-1px)}}
@keyframes day-movie{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes day-nap{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(1px)}}
@keyframes day-shop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes day-tram{0%,100%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}}

/* Extra Swiss winter storybook animations */
.day-figure{cursor:pointer;outline:none}

/* Use Times New Roman throughout the entire journal */
html,body,body *{font-family:"Times New Roman",Times,serif!important}

.cloudbar{max-width:1100px;margin:10px auto 0;padding:0 14px;color:var(--ink)}

function setCloudError(msg){const e=document.getElementById("cloud-error");if(e)e.textContent=msg;else cloudMessage(msg)}
async function pushCloud(){
  if(!sbClient||!cloudUser)return;
  if(cloudBusy){queueCloudSave();return}
  cloudBusy=true;
  const revisionAtStart=cloudRevision;
  cloudMessage("Saving your complete journal and photos to cloud…");
  // PH contains the compressed photo data URLs. Store it alongside all planner state.
  const completeJournal={...S,_photos:PH};
  const {error}=await sbClient.from("swiss_planner_data").upsert({
    user_id:cloudUser.id,data:completeJournal,updated_at:new Date().toISOString()
  },{onConflict:"user_id"});
  cloudBusy=false;
  if(error){cloudMessage("Cloud save failed: "+error.message+". If you added many photos at once, try syncing fewer photos at a time.");return}
  const photoCount=Object.values(PH).reduce((n,arr)=>n+(Array.isArray(arr)?arr.length:0),0);
  cloudMessage(`Everything synced ✓ · ${photoCount} photos backed up`);
  if(cloudRevision!==revisionAtStart)queueCloudSave();
}
function queueCloudSave(){
  cloudRevision++;
  if(!sbClient||!cloudUser)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>pushCloud(),1000);
}
async function pullCloud(){
  if(!sbClient||!cloudUser)return;
  cloudMessage("Checking cloud journal…");
  const {data,error}=await sbClient.from("swiss_planner_data").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();
  if(error){cloudMessage("Could not load cloud data: "+error.message);return}
  if(data?.data){
    const useCloud=confirm("A cloud copy of your Switzerland Travel Journal was found.\n\nOK = restore the complete cloud journal, including backed-up photos, to this browser.\nCancel = keep this browser's current journal and upload all its data and photos to the cloud.");
    if(useCloud){
      const cloudCopy=data.data;
      PH=cloudCopy._photos&&typeof cloudCopy._photos==="object"?cloudCopy._photos:PH;
      delete cloudCopy._photos;
      S=cloudCopy;
      try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(PHK,JSON.stringify(PH))}catch(e){cloudMessage("Cloud data loaded, but browser storage is full. Your cloud backup is safe.")}
      draw();
      // Re-upload after restore so any photos that existed only on this device
      // are also included in the cloud copy (useful when migrating from the older version).
      await pushCloud();
      const photoCount=Object.values(PH).reduce((n,arr)=>n+(Array.isArray(arr)?arr.length:0),0);
      cloudMessage(`Complete cloud journal restored ✓ · ${photoCount} photos backed up`);
    }else{
      await pushCloud();
    }
  }else{
    await pushCloud();
  }
}
async function cloudLogin(){
  const email=document.getElementById("cloud-email")?.value.trim();
  const password=document.getElementById("cloud-password")?.value;
  if(!email||!password){setCloudError("Enter your email and password.");return}
  cloudMessage("Signing in…");
  const {data,error}=await sbClient.auth.signInWithPassword({email,password});
  if(error){setCloudError(error.message);return}
  cloudUser=data.user;renderCloudBar();await pullCloud();
}
async function cloudSignup(){
  const email=document.getElementById("cloud-email")?.value.trim();
  const password=document.getElementById("cloud-password")?.value;
  if(!email||!password){setCloudError("Enter your email and password.");return}
  if(password.length<8){setCloudError("Use a password with at least 8 characters.");return}
  cloudMessage("Creating account…");
  const {data,error}=await sbClient.auth.signUp({email,password});
  if(error){setCloudError(error.message);return}
  if(data.session){cloudUser=data.user;renderCloudBar();await pullCloud()}
  else{cloudMessage("Account created. Check your email to confirm, then log in here.");}
}
async function cloudLogout(){
  if(!sbClient)return;
  await sbClient.auth.signOut();cloudUser=null;cloudMessage("Signed out · local copy remains on this device");renderCloudBar();
}
document.addEventListener("click",e=>{

  });
}

// Keyboard navigation: Right/Next = next day, Left/Previous = previous day.
document.addEventListener("keydown",e=>{
  if(tab!=="it") return;
  const el=e.target;
  if(el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  let step=0;
  if(e.key==="ArrowRight" || e.key==="PageDown" || e.key==="n" || e.key==="N") step=1;
  else if(e.key==="ArrowLeft" || e.key==="PageUp" || e.key==="p" || e.key==="P") step=-1;
  if(!step) return;
  const next=Math.max(0,Math.min(S.days.length-1,dayIdx+step));
  if(next===dayIdx) return;
  e.preventDefault();
  dayIdx=next;
  draw();
  const strip=main.querySelector(".chips");
  const active=strip?.querySelector("button.on");
  if(strip && active) strip.scrollTo({left:Math.max(0,active.offsetLeft-strip.clientWidth/2+active.clientWidth/2),behavior:"smooth"});
});
